name: iOS Build & Screenshot

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4

    - name: Xcode 버전 확인
      run: xcodebuild -version

    - name: 스킴 목록 확인
      run: xcodebuild -list -project "AboutRamen.xcodeproj"

    - name: iOS 빌드
      run: |
        xcodebuild build \
          -project "AboutRamen.xcodeproj" \
          -scheme "AboutRamen" \
          -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
          -configuration Debug \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: 스크린샷 저장
      run: |
        xcrun simctl boot "iPhone 16" || true
        sleep 5
        APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" | head -1)
        xcrun simctl install booted "$APP_PATH"
        xcrun simctl launch booted com.pursWon.AboutRamen
        sleep 3
        mkdir -p screenshots
        xcrun simctl io booted screenshot screenshots/screen1.png

    - name: 스크린샷 업로드
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: iOS-Screenshots
        path: screenshots/