workflows:
  ios-build:
    name: iOS Build & Screenshot
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: iOS 빌드
        script: |
          xcodebuild build \
            -project AboutRamen.xcodeproj \
            -scheme AboutRamen \
            -destination 'id=1114811B-9965-4FCA-A185-B1000429EC83' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=5 \
            SWIFT_STRICT_CONCURRENCY=minimal \
            OTHER_SWIFT_FLAGS="-warnings-as-errors false"

      - name: 시뮬레이터 스크린샷
        script: |
          xcrun simctl boot "1114811B-9965-4FCA-A185-B1000429EC83" || true
          sleep 5
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -not -path "*/PlugIns/*" | head -1)
          echo "앱 경로: $APP_PATH"
          xcrun simctl install booted "$APP_PATH"
          sleep 2
          mkdir -p screenshots
          xcrun simctl io booted screenshot screenshots/screen1.png

    artifacts:
      - screenshots/**