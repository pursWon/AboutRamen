workflows:
  ios-build:
    name: iOS Build & Screenshot
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: 16.2
      groups:
        - kakao_secrets   # Codemagic 대시보드 > Environment variables 에 KAKAO_API_KEY(암호화)를 이 그룹으로 등록

    scripts:
      - name: API 키 파일 준비
        script: |
          cp AboutRamen/RamenInfo.plist.example AboutRamen/RamenInfo.plist

          if [ -n "$KAKAO_API_KEY" ]; then
            echo "KAKAO_API_KEY 감지됨 - 실제 키로 교체합니다."
            /usr/libexec/PlistBuddy -c "Set :API_KEY $KAKAO_API_KEY" AboutRamen/RamenInfo.plist
          else
            echo "KAKAO_API_KEY 미설정 - 더미 키로 빌드합니다 (라멘 목록은 비어있게 나옴)."
          fi

      - name: iOS 빌드
        script: |
          xcodebuild build \
            -project AboutRamen.xcodeproj \
            -scheme AboutRamen \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.2' \
            -configuration Debug \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: idb 설치 (탭 이벤트 주입용)
        script: |
          brew tap facebook/fb
          brew install idb-companion
          pip3 install fb-idb

      - name: 시뮬레이터 스크린샷 (탭바 3개 화면)
        script: |
          xcrun simctl boot "iPhone 16" || true
          sleep 5

          UDID=$(xcrun simctl list devices | grep "iPhone 16 (" | grep -Eo '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -1)
          echo "시뮬레이터 UDID: $UDID"

          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -not -path "*/PlugIns/*" | head -1)
          echo "앱 경로: $APP_PATH"
          xcrun simctl install booted "$APP_PATH"
          sleep 2
          BUNDLE_ID=$(defaults read "$APP_PATH/Info" CFBundleIdentifier)
          echo "번들 ID: $BUNDLE_ID"

          # 위치 권한 팝업이 뜨지 않도록 실행 전에 미리 허용 + 가상 GPS 좌표 설정 (서울시청)
          # 팝업이 떠버리면 이후 idb 탭이 전부 씹힘 (시스템 알림이 떠 있는 동안은
          # 알림 버튼 외의 영역은 앱으로 터치가 전달되지 않음)
          xcrun simctl privacy booted grant location "$BUNDLE_ID"
          xcrun simctl location booted set 37.5665,126.9780

          xcrun simctl launch booted "$BUNDLE_ID"
          # 위치 확정 -> Kakao 키워드 검색 -> 가게별 이미지 검색까지 순차 네트워크 호출이라
          # 목록이 다 채워질 때까지 넉넉히 대기
          sleep 8

          mkdir -p screenshots

          # 화면 1: 홈 (기본 진입 탭)
          xcrun simctl io booted screenshot screenshots/screen1_home.png

          # idb 데몬 연결 (탭 이벤트 주입은 simctl로 불가능해서 idb를 사용)
          idb_companion --udid "$UDID" &
          sleep 3
          idb connect "$UDID"

          # 탭바 좌표는 iPhone 16 시뮬레이터(393x852pt) 기준 근사치.
          # 다른 기기/OS로 바꾸면 좌표를 다시 맞춰야 할 수 있음.

          # 화면 2: 마이 리스트 탭
          idb ui tap 196 810 --udid "$UDID"
          sleep 2
          xcrun simctl io booted screenshot screenshots/screen2_mylist.png

          # 화면 3: 검색하기 탭
          idb ui tap 327 810 --udid "$UDID"
          sleep 2
          xcrun simctl io booted screenshot screenshots/screen3_search.png

    artifacts:
      - screenshots/**